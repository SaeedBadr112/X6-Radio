workflows:
  ios-build:
    name: iOS Build (Unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      cocoapods: default
      xcode: latest
    scripts:
      - name: تثبيت الاعتماديات
        script: |
          npm install
      - name: مزامنة Capacitor iOS
        script: |
          npx cap sync ios
      - name: تثبيت CocoaPods
        script: |
          cd ios/App
          pod install
          cd ../..
      - name: بناء التطبيق (بدون توقيع)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: إنشاء IPA من الـ App.app
        script: |
          cd ios/App
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphoneos/App.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -X App.ipa Payload/
          ls -la App.ipa
    artifacts:
      - ios/App/build/App.ipa