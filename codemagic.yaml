workflows:
  ios-build:
    name: iOS Build (Simulator Version)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      cocoapods: default
      xcode: latest
    scripts:
      - name: تثبيت الاعتماديات
        script: |
          npm install
      - name: مزامنة Capacitor iOS
        script: |
          npx cap sync ios
      - name: تثبيت CocoaPods
        script: |
          cd ios/App
          pod install
          cd ../..
      - name: بناء التطبيق للمحاكي السحابي
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: ضغط حزمة المحاكي
        script: |
          cd ios/App
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Release-iphonesimulator/App.app" | head -1)
          echo "Found simulator app at: $APP_PATH"
          mkdir -p build
          cp -r "$APP_PATH" build/
          cd build
          zip -r App.app.zip App.app
    artifacts:
      - ios/App/build/App.app.zip
